# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build ChestsPlusPlus

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  create:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.9
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'adopt'
        cache: 'maven'

    - name: Set version from tag or commit
      id: set_version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          # Remove 'refs/tags/v' prefix to get the version
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          # Use short commit SHA for non-tag builds
          VERSION="${GITHUB_SHA::7}"
        fi
        echo "Setting version to $VERSION"
        mvn versions:set -DnewVersion=$VERSION
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build with Maven
      run: mvn -B package --file pom.xml
              
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        draft: true
        generate_release_notes: true
        files: |
          ./Server/plugins/ChestsPlusPlus-*.jar

    - name: Upload to 'latest' release (non-tag builds)
      uses: softprops/action-gh-release@v1
      if: "!startsWith(github.ref, 'refs/tags/v')"
      with:
        tag_name: latest
        name: Latest Build
        body: |
          Automated build from commit ${{ github.sha }}
        draft: false
        prerelease: true
        files: |
          ./Server/plugins/ChestsPlusPlus-*.jar

