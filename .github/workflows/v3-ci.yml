name: v3 CI

on:
  # Tags are left to v3-release.yml, which runs this workflow itself before drafting the release.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unit + MockBukkit + release jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/verifyReleaseJar.txt
          if-no-files-found: ignore
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: ChestsPlusPlus
          path: build/libs/ChestsPlusPlus-*.jar
          if-no-files-found: error

  e2e:
    name: E2E (Plugwright, Paper 26.3 via ViaVersion)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RCON_PASSWORD: ${{ secrets.E2E_RCON_PASSWORD }}
      ACCEPT_MINECRAFT_EULA: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Paper, plugins and Node
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/chestsplusplus-e2e
            ~/.gradle/caches/plugwright
            run/e2e/cache
            run/e2e/libraries
            run/e2e/versions
          key: e2e-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'src/test/e2e/package-lock.json') }}
      - name: Run E2E suite
        run: ./gradlew e2e --stacktrace
      - name: Upload Plugwright reports and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            build/reports/plugwright/
            run/e2e/e2e-server.log
            run/e2e/logs/
          if-no-files-found: ignore
