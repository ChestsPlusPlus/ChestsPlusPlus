name: v3 CI

on:
  # Feature branches run through pull_request, avoiding a second run when the PR opens or is updated.
  # Tags are left to v3-release.yml, which runs this workflow itself before drafting the release.
  push:
    branches: ["v3"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Ref to build, for v3-release.yml; empty builds the event's own commit
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unit + MockBukkit + release jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # setup-gradle only saves its cache on the default branch (master, still v2) unless told otherwise. Pushes save it and
      # PRs read it, whichever branch the push trigger names.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/verifyReleaseJar.txt
          if-no-files-found: ignore
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: ChestsPlusPlus
          path: build/libs/ChestsPlusPlus-*.jar
          if-no-files-found: error

  e2e:
    name: E2E (Plugwright, Paper 26.3 via ViaVersion)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_RCON_PASSWORD: ${{ secrets.E2E_RCON_PASSWORD }}
      ACCEPT_MINECRAFT_EULA: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # As in build. The Paper and Node downloads are left to the caches below, so they aren't stored twice.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/chestsplusplus-e2e
            caches/plugwright
      # Keyed on only the catalog lines that pick each download, so a dependency or npm update elsewhere keeps them.
      - name: Key the E2E caches
        id: e2e-keys
        run: |
          echo "paper=$(grep -E '^(paperServer|viaversion|viabackwards|jdbi|configlib)' gradle/libs.versions.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "node=$(grep -E '^plugwright ' gradle/libs.versions.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Paper and plugins
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/chestsplusplus-e2e
            run/e2e/cache
            run/e2e/libraries
            run/e2e/versions
          key: e2e-paper-${{ runner.os }}-${{ steps.e2e-keys.outputs.paper }}
      - name: Cache Node
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/plugwright
          key: e2e-node-${{ runner.os }}-${{ steps.e2e-keys.outputs.node }}
      - name: Run E2E suite
        run: ./gradlew e2e --stacktrace
      - name: Upload Plugwright reports and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            build/reports/plugwright/
            run/e2e/e2e-server.log
            run/e2e/logs/
          if-no-files-found: ignore
