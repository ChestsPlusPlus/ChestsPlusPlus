name: v3 Tag release

# Runs when a release/v<version> PR from v3-prepare-release.yml is merged: tags the merge commit and runs v3-release.yml on the
# tag. A tag created with GITHUB_TOKEN doesn't trigger push workflows, but a workflow_dispatch does.
on:
  pull_request:
    types: [closed]
    branches: [v3]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/v3.') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Tag the merge commit and start the release
        run: |
          tag="${BRANCH#release/}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA"
          gh workflow run v3-release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
