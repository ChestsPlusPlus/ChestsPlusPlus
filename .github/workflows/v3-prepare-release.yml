name: v3 Prepare release

# Run by hand with a version (3.0.0-beta.1 or 3.0.0). Opens a release/v<version> PR into v3; merging it tags the merge commit
# (v3-tag-release.yml), which drafts the GitHub release. A final version also dates its "## <version> (unreleased)" changelog
# heading. Needs "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 3.0.0-beta.1 or 3.0.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3
      - name: Check the version
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::$VERSION isn't a version like 3.0.0, 3.0.0-alpha.1, 3.0.0-beta.2 or 3.0.0-rc.1"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null; then echo "::error::Tag v$VERSION already exists"; exit 1; fi
          heading="## ${VERSION%%-*} (unreleased)"
          grep -qxF "$heading" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '$heading' section"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_ENV"
      - name: Date the changelog heading
        if: ${{ !contains(env.VERSION, '-') }}
        run: sed -i "s/^## ${VERSION//./\\.} (unreleased)\$/## $VERSION ($(date -u +%F))/" CHANGELOG.md
      - name: Push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Release v$VERSION" --allow-empty
          git push origin "$BRANCH"
      - name: Open the release PR
        run: |
          gh pr create --base v3 --head "$BRANCH" --title "Release v$VERSION" --body "Merging this tags the merge commit as \`v$VERSION\`, runs the full CI and drafts the GitHub release. Publishing the draft uploads the jar to Modrinth.

          CI doesn't run on this PR, because a PR opened by a workflow doesn't trigger other workflows. The release runs it before drafting."
