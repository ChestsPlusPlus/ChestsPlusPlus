# ChestsPlusPlus v3 configuration. Reload with /cpp reload.

features:
  # Turning chestlinks or autocraft off keeps every group and its items, ready for when it is turned back on. Until then their
  # linked blocks can't be opened, linked or broken, their commands and menus refuse, hoppers, droppers, crafters and golems
  # don't move items through ChestLinks, and AutoCrafters stop crafting.
  chestlinks: true
  autocraft: true
  hopper-filters: true
  # Copper golems take items from linked copper chests and deliver into linked chests (only while chestlinks is on).
  copper-golems: true

linking:
  # Use up one name tag each time a block is linked by right-clicking it with a named name tag (never in creative).
  consume-name-tags: true
  # Use up the sign when a block is linked with a [ChestLink] or [AutoCraft] sign. When false, the sign goes back to the player.
  consume-signs: false

chestlink:
  # Play the lid animation on every node of a group, not just the one that was opened.
  animate-all-nodes: true
  display:
    enabled: true
    label: true
    # Multiplier on the client's entity view distance (1.0 = 64 blocks at default settings).
    view-range: 0.5

autocraft:
  display:
    enabled: true
    label: true
    view-range: 0.5
  # Ticks between crafting attempts (20 = once a second).
  tick-interval: 20

filters:
  # Show each hopper's filter entries as small items on its sides (look at them to see allow/deny details).
  displays: true

# -1 = unlimited. Overridden per player by chestsplusplus.limit.chestlink.<n> / chestsplusplus.limit.autocraft.<n>.
limits:
  chestlink-default: -1
  autocraft-default: -1

worlds:
  # Worlds where ChestLinks and AutoCrafters cannot be created, linked or opened.
  blacklist: []

storage:
  flush-interval-seconds: 30

update-checker:
  enabled: true

metrics:
  enabled: true
