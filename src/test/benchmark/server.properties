# The benchmark world's server (docs/benchmarking.md), the same for v2 on Paper 1.21.7 and v3 on Paper 26.3. The tasks add the RCON settings.
server-ip=127.0.0.1
server-port=25567
online-mode=false
enable-rcon=true
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:dirt","height"\:2},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:plains"}
level-seed=chestsplusplus
generate-structures=false
spawn-protection=0
difficulty=peaceful
spawn-monsters=false
view-distance=4
simulation-distance=4
# Nobody joins, and an empty server would otherwise stop ticking after a minute.
pause-when-empty-seconds=0
motd=ChestsPlusPlus benchmark
